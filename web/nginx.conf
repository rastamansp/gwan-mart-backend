# Loja do Gwan Mart — nginx.
#
# Este arquivo é um TEMPLATE: a imagem oficial do nginx roda envsubst sobre ele
# no start (/etc/nginx/templates/ → /etc/nginx/conf.d/). Só são trocadas as
# variáveis de ambiente que existem no container — as do próprio nginx ($uri,
# $request_uri...) passam intactas. Variáveis usadas aqui:
#
#   MART_API_UPSTREAM  host:porta da API na rede interna (default gwan-mart-backend:3011)
#   MART_SITE_URL      origem pública da loja, sem barra final (default https://mart.gwan.cloud)
#   NGINX_LOCAL_RESOLVERS  DNS para resolver a API em tempo de requisição —
#                      exportado pelo próprio entrypoint da imagem a partir do
#                      /etc/resolv.conf (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1)
#
# Prévia de link por produto: ver openspec/changes/add-storefront-seo/design.md.

# Código do produto a partir da URL original. Só caracteres de código/URL
# codificada: nada de barra nem ponto inicial chega à API.
map $request_uri $seo_product_code {
    "~^/product/(?<code>[A-Za-z0-9_~%-][A-Za-z0-9._~%-]*)/?(\?.*)?$" $code;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A API é resolvida a cada requisição (proxy_pass com variável), não no
    # boot: com nome fixo, o nginx se recusa a subir enquanto a API não existir
    # na rede — e a stack não tem depends_on de propósito.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    resolver_timeout 2s;
    set $mart_api_upstream "${MART_API_UPSTREAM}";

    # Usado pelo HEALTHCHECK do container e pelo healthcheck do compose.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Não depende da API nem do banco: responde mesmo com a API fora.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /__seo/\n\nSitemap: ${MART_SITE_URL}/sitemap.xml\n";
    }

    # Gerado pela API a partir do catálogo ativo (GET /api/seo/sitemap.xml).
    location = /sitemap.xml {
        proxy_pass http://$mart_api_upstream/api/seo/sitemap.xml;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Página de produto: o mesmo index.html da SPA, com SSI ligado. O SSI troca
    # o bloco de meta padrão pelo <head> do produto (subrequisição abaixo); se
    # ela falhar, o "stub" do index.html devolve as meta padrão. A página abre
    # de qualquer jeito — o pior caso é a prévia genérica.
    location /product/ {
        ssi on;
        ssi_silent_errors on;
        try_files /index.html =404;
    }

    # Subrequisição do SSI. `internal`: inalcançável de fora.
    location = /__seo/product {
        internal;
        if ($seo_product_code = "") {
            return 204;
        }
        proxy_pass http://$mart_api_upstream/api/seo/products/$seo_product_code/head;
        # Resposta de erro da API TEM corpo (o JSON do 404), e o SSI incluiria
        # esse corpo no <head> em vez de usar o stub — inclusive ecoando o
        # código pedido sem escape. Todo erro vira 204 vazio → stub (meta padrão).
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 408 429 500 502 503 504 = @seo_none;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        # Curto: a prévia não pode segurar o HTML da página.
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    location @seo_none {
        return 204;
    }

    # SPA: /catalog e /product/PROD-001 são rotas do React Router, não arquivos.
    # Sem este fallback, abrir o link que o bot manda daria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
