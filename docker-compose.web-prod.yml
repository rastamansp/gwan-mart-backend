# Stack da loja do Gwan Mart (mart.gwan.cloud), slot 11.
#
# Separada da stack da API (docker-compose.production.yml) de propósito: loja e
# API sobem, caem e são atualizadas de forma independente no Portainer. As duas
# se encontram pelo domínio público, não pela rede interna — o navegador do
# visitante é quem chama a API.
#
# Deploy exclusivamente via Portainer (Stacks → Add/Update stack).
#
# Pré-requisito: registro A de mart.gwan.cloud → 187.127.5.72.
services:
  gwan-mart-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked no bundle em tempo de build: mudar isso exige rebuild, não
        # apenas restart da stack.
        VITE_MART_API_URL: ${MART_API_URL:-https://mart-api.gwan.cloud/api}
        VITE_APP_NAME: ${MART_APP_NAME:-Gwan Mart}
        VITE_APP_VERSION: ${MART_APP_VERSION:-0.1.0}
    container_name: gwan-mart-web
    restart: unless-stopped

    networks:
      - gwan-network

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--timeout=5", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=gwan-network"

      # HTTPS
      - "traefik.http.routers.gwan-mart-web.rule=Host(`${MART_WEB_HOST:-mart.gwan.cloud}`)"
      - "traefik.http.routers.gwan-mart-web.entrypoints=websecure"
      - "traefik.http.routers.gwan-mart-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.gwan-mart-web.loadbalancer.server.port=80"

      # Redirect HTTP → HTTPS (middleware com nome próprio da stack)
      - "traefik.http.routers.gwan-mart-web-http.rule=Host(`${MART_WEB_HOST:-mart.gwan.cloud}`)"
      - "traefik.http.routers.gwan-mart-web-http.entrypoints=web"
      - "traefik.http.routers.gwan-mart-web-http.middlewares=gwan-mart-web-https-redirect"
      - "traefik.http.middlewares.gwan-mart-web-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gwan-mart-web-https-redirect.redirectscheme.permanent=true"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  gwan-network:
    external: true
    name: gwan-network
