# API do Gwan Mart em container, para dev local.
#
# Portas do slot 11 do ecossistema GWAN (gwan-infra:
# docs/spec/40-padroes/alocacao-de-portas.md): API 3011, loja 5184,
# PostgreSQL isolado 5444, Redis isolado 6391.
#
# A infra de dev (PostgreSQL, Redis, MinIO) NAO vive aqui: vem do
# docker-compose.dev.yml de gwan-infra/apps/mart-backend/. Este compose fala com
# ela pelas portas publicadas no host (host.docker.internal).
#
# O servico "gwan-events-mcp" que existia aqui foi removido: era residuo do fork,
# e o src/mcp/server-sse.ts usa transporte stdio — nao escuta a 3002 que ele
# publicava, entao o healthcheck falhava sempre.
services:
  gwan-mart-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gwan-mart-backend-dev
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=development
      - PORT=3011
      - API_BASE_URL=http://localhost:3011
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_EXPIRES_IN=24h
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5444/gwan_mart
      - REDIS_URL=redis://host.docker.internal:6391
      - MINIO_ENDPOINT=host.docker.internal
      - MINIO_PORT=9010
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=gwan-mart-uploads
      - MINIO_USE_SSL=false
      - CORS_ORIGINS=http://localhost:5184
      - FRONTEND_URL=http://localhost:5184
      - MCP_BASE_URL=http://localhost:3011
      - MCP_AUTH_TOKEN=
      - LOG_LEVEL=debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=false"
